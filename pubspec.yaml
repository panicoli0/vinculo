name: vinculo
description: "Vínculo: family bonds through questions."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  go_router: 18.1.1
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  slang: 4.19.2
  slang_flutter: 4.19.0
  shared_preferences: 2.5.6
  share_plus: 13.3.1
  url_launcher: 6.3.3
  package_info_plus: 10.2.2
  uuid: 4.6.0
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  cloud_functions: 7.0.1
  firebase_app_check: 0.5.1
  google_sign_in: 7.2.0
  crypto: 3.0.8
  sign_in_with_apple: 8.2.0
  app_links: 7.2.2
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2

dev_dependencies:
  flutter_lints: 6.0.0
  build_runner: 2.15.1
  riverpod_generator: 4.0.9
  freezed: 4.0.0-dev.3
  json_serializable: 6.15.2

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: "assets/fonts/Nunito[wght].ttf"
