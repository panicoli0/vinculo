base_locale: es
fallback_strategy: base_locale
input_directory: lib/core/i18n
input_file_pattern: .i18n.json
output_directory: lib/core/i18n
output_file_name: translations.g.dart
translate_var: t
locale_handling: true
flutter_integration: true
lazy: false
# Sin el sello de hora en la cabecera generada. Con él, `translations.g.dart`
# cambia en cada corrida de slang aunque las traducciones no se toquen, y eso
# vuelve inverificable la regla 4 de AGENTS.md: "los generados tienen que
# coincidir con su fuente en el mismo commit" no se puede comprobar
# regenerando si regenerar siempre produce un diff.
timestamp: false
